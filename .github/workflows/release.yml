name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag against PKG_VERSION
        id: version
        run: |
          set -eu
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          # v<PKG_VERSION> is a release; v<PKG_VERSION>-rc<N> a pre-release.
          prerelease=""
          if [ -n "$version" ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") prerelease=0 ;;
              "v$version"-rc*)
                case "${GITHUB_REF_NAME#"v$version"-rc}" in
                  '' | *[!0-9]*) ;;
                  *) prerelease=1 ;;
                esac
                ;;
            esac
          fi
          if [ -z "$prerelease" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Makefile PKG_VERSION v$version (or v$version-rc<N>)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "prerelease=$prerelease" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Build test image
        run: docker build -t mihowrt-test:local -f Dockerfile.test .

      - name: Run tests
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace mihowrt-test:local bash tests/run.sh

      - name: Build APKs
        run: ./tools/build-sdk.sh build

      - name: Stage release assets and checksums
        run: |
          set -eu
          mkdir -p release
          for name in luci-app-mihowrt luci-i18n-mihowrt-ru; do
            set -- dist/"$name"-[0-9]*.apk
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one dist/$name-<ver>.apk, found: $*" >&2
              exit 1
            fi
            cp "$1" "release/$(basename "$1")"
            cp "$1" "release/$name.apk"
          done
          cd release
          sha256sum \
            luci-app-mihowrt-[0-9]*.apk \
            luci-i18n-mihowrt-ru-[0-9]*.apk \
            luci-app-mihowrt.apk \
            luci-i18n-mihowrt-ru.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty '## $VERSION' section" >&2
            exit 1
          fi

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/
            release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -eu
          set -- release/*.apk release/SHA256SUMS
          if [ "$PRERELEASE" = 1 ]; then
            set -- --prerelease "$@"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$@"
