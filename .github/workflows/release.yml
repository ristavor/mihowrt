name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      matrix:
        sdk: ['25.12', '24.10']
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      MIHOWRT_SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag against PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          set -eu
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          # v<PKG_VERSION> is a release; v<PKG_VERSION>-rc<N> a pre-release.
          prerelease=""
          if [ -n "$version" ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") prerelease=0 ;;
              "v$version"-rc*)
                case "${GITHUB_REF_NAME#"v$version"-rc}" in
                  '' | *[!0-9]*) ;;
                  *) prerelease=1 ;;
                esac
                ;;
            esac
          fi
          if [ -z "$prerelease" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Makefile PKG_VERSION v$version (or v$version-rc<N>)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "prerelease=$prerelease" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Verify release commit is on main
        if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.prerelease == '0'
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            *-rc*) exit 0 ;;
          esac
          git fetch --depth=100 origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $GITHUB_REF_NAME commit $(git rev-parse HEAD) is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Cache SDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sdk
          key: sdk-${{ matrix.sdk }}

      - name: Build test image
        run: docker build -t mihowrt-test:local -f Dockerfile.test .

      - name: Run tests
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace mihowrt-test:local bash tests/run.sh

      - name: Build packages
        run: ./tools/build-sdk.sh build

      - name: Inspect built APKs
        if: matrix.sdk == '25.12'
        run: |
          docker run --rm -i -v "$PWD:/workspace:ro" -w /workspace mihowrt-test:local bash -euo pipefail << 'EOF'
          set -euo pipefail
          apk_list=(dist/*.apk)
          [ "${#apk_list[@]}" -gt 0 ] || { echo "No APKs found in dist/" >&2; exit 1; }

          for apk in "${apk_list[@]}"; do
            [ -f "$apk" ] || continue
            echo "=========================================="
            echo "Inspecting APK: $(basename "$apk")"
            echo "=========================================="
            dump="$(apk adbdump "$apk")"

            # 1. Architecture check (must be noarch)
            arch="$(printf "%s\n" "$dump" | awk '/^  arch:/ { print $2 }')"
            echo "Architecture: $arch"
            if [ "$arch" != "noarch" ]; then
              echo "ERROR: $(basename "$apk") arch is not noarch: $arch" >&2
              exit 1
            fi

            # 2. Dependencies check (must be non-empty)
            echo "Dependencies:"
            deps="$(printf "%s\n" "$dump" | awk '
              /^  depends:/ { f=1; next }
              f && /^    - / { sub(/^    - /, ""); print; next }
              f { f=0 }
            ')"
            if [ -z "$deps" ]; then
              echo "ERROR: $(basename "$apk") has no dependencies" >&2
              exit 1
            fi
            printf "%s\n" "$deps"

            # 3. Scripts check (must be present)
            echo "Scripts:"
            scripts="$(printf "%s\n" "$dump" | awk '
              /^scripts:/ { f=1; next }
              f && /^  [a-z-]+:/ { sub(/:.*/, ""); sub(/^ +/, ""); print; next }
              f && /^[^ ]/ { f=0 }
            ')"
            if [ -z "$scripts" ]; then
              echo "ERROR: $(basename "$apk") has no scripts" >&2
              exit 1
            fi
            printf "%s\n" "$scripts"

            # 4. File list and modes
            echo "Files and modes:"
            file_modes="$(printf "%s\n" "$dump" | awk '
              /^paths:/ { in_paths=1; next }
              in_paths && /^  - name: / { cur_dir=$3; in_files=0; next }
              in_paths && /^    files:/ { in_files=1; next }
              in_paths && in_files && /^      - name: / { cur_file=$3; next }
              in_paths && in_files && /^          mode: / {
                mode=$2
                if (cur_dir != "") {
                  print cur_dir "/" cur_file, mode
                } else {
                  print cur_file, mode
                }
                next
              }
              in_paths && /^[^ ]/ { in_paths=0 }
            ')"
            if [ -z "$file_modes" ]; then
              echo "ERROR: $(basename "$apk") has no files" >&2
              exit 1
            fi
            printf "%s\n" "$file_modes"

            # 5. Check modes of etc/init.d/mihowrt and usr/bin/* (must be executable)
            found_init=0
            found_usr_bin=0
            while read -r file mode; do
              [ -n "$file" ] || continue
              case "$file" in
                etc/init.d/mihowrt)
                  found_init=1
                  case "$mode" in
                    07[57][57]|0555) echo "OK: $file executable mode $mode" ;;
                    *) echo "ERROR: $file has non-executable mode $mode" >&2; exit 1 ;;
                  esac
                  ;;
                usr/bin/*)
                  found_usr_bin=1
                  case "$mode" in
                    07[57][57]|0555) echo "OK: $file executable mode $mode" ;;
                    *) echo "ERROR: $file has non-executable mode $mode" >&2; exit 1 ;;
                  esac
                  ;;
              esac
            done <<< "$file_modes"

            case "$(basename "$apk")" in
              luci-app-mihowrt*)
                if [ "$found_init" -ne 1 ]; then
                  echo "ERROR: $(basename "$apk") missing etc/init.d/mihowrt" >&2
                  exit 1
                fi
                if [ "$found_usr_bin" -ne 1 ]; then
                  echo "ERROR: $(basename "$apk") missing usr/bin/*" >&2
                  exit 1
                fi
                ;;
            esac
          done
          echo "All APK checks passed."
          EOF

      - name: Inspect built IPKs
        if: matrix.sdk == '24.10'
        run: |
          docker run --rm -i -v "$PWD:/workspace:ro" -w /workspace mihowrt-test:local bash -euo pipefail << 'EOF'
          set -euo pipefail
          ipk_list=(dist/*.ipk)
          [ "${#ipk_list[@]}" -gt 0 ] || { echo "No IPKs found in dist/" >&2; exit 1; }

          for ipk in "${ipk_list[@]}"; do
            [ -f "$ipk" ] || continue
            echo "=========================================="
            echo "Inspecting IPK: $(basename "$ipk")"
            echo "=========================================="
            tmp_dir="$(mktemp -d)"
            tar -xzf "$ipk" -C "$tmp_dir"
            mkdir -p "$tmp_dir/control_dir" "$tmp_dir/data_dir"
            tar -xzf "$tmp_dir/control.tar.gz" -C "$tmp_dir/control_dir"
            tar -xzf "$tmp_dir/data.tar.gz" -C "$tmp_dir/data_dir"

            # 1. Architecture check (must be Architecture: all)
            arch="$(awk -F': *' '$1 == "Architecture" { print $2 }' "$tmp_dir/control_dir/control")"
            echo "Architecture: $arch"
            if [ "$arch" != "all" ]; then
              echo "ERROR: $(basename "$ipk") Architecture: $arch is not Architecture: all" >&2
              exit 1
            fi

            # 2. Dependencies check (must be non-empty)
            echo "Dependencies:"
            deps="$(awk -F': *' '$1 == "Depends" { print $2 }' "$tmp_dir/control_dir/control")"
            if [ -z "$deps" ]; then
              echo "ERROR: $(basename "$ipk") has no Depends list" >&2
              exit 1
            fi
            printf "%s\n" "$deps"

            # 3. Conffiles and file modes for app package
            case "$(basename "$ipk")" in
              luci-app-mihowrt*)
                if [ ! -s "$tmp_dir/control_dir/conffiles" ]; then
                  echo "ERROR: $(basename "$ipk") missing conffiles" >&2
                  exit 1
                fi
                if ! grep -q "^/etc/config/mihowrt" "$tmp_dir/control_dir/conffiles" || \
                   ! grep -q "^/opt/clash/config.yaml" "$tmp_dir/control_dir/conffiles"; then
                  echo "ERROR: $(basename "$ipk") conffiles missing expected entries" >&2
                  exit 1
                fi

                init_file="$tmp_dir/data_dir/etc/init.d/mihowrt"
                if [ ! -f "$init_file" ]; then
                  echo "ERROR: $(basename "$ipk") missing etc/init.d/mihowrt" >&2
                  exit 1
                fi
                init_mode="$(stat -c "%04a" "$init_file")"
                case "$init_mode" in
                  07[57][57]|0555) echo "OK: etc/init.d/mihowrt mode $init_mode" ;;
                  *) echo "ERROR: etc/init.d/mihowrt has non-executable mode $init_mode" >&2; exit 1 ;;
                esac

                usr_bin_files=("$tmp_dir/data_dir/usr/bin/"*)
                if [ "${#usr_bin_files[@]}" -eq 0 ] || [ ! -f "${usr_bin_files[0]}" ]; then
                  echo "ERROR: $(basename "$ipk") missing usr/bin/*" >&2
                  exit 1
                fi
                for ub in "${usr_bin_files[@]}"; do
                  ub_mode="$(stat -c "%04a" "$ub")"
                  case "$ub_mode" in
                    07[57][57]|0555) echo "OK: $(basename "$ub") mode $ub_mode" ;;
                    *) echo "ERROR: $ub has non-executable mode $ub_mode" >&2; exit 1 ;;
                  esac
                done
                ;;
            esac
            rm -rf "$tmp_dir"
          done
          echo "All IPK checks passed."
          EOF

      - name: Upload built packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.sdk }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Stage release assets and checksums
        run: |
          set -eu
          mkdir -p release
          for name in luci-app-mihowrt luci-i18n-mihowrt-ru; do
            set -- dist/"$name"-[0-9]*.apk
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one dist/$name-<ver>.apk, found: $*" >&2
              exit 1
            fi
            cp "$1" "release/$(basename "$1")"
            cp "$1" "release/$name.apk"

            set -- dist/"${name}"_[0-9]*_all.ipk
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one dist/${name}_<ver>_all.ipk, found: $*" >&2
              exit 1
            fi
            cp "$1" "release/$(basename "$1")"
            cp "$1" "release/$name.ipk"
          done
          cd release
          sha256sum \
            luci-app-mihowrt-[0-9]*.apk \
            luci-i18n-mihowrt-ru-[0-9]*.apk \
            luci-app-mihowrt.apk \
            luci-i18n-mihowrt-ru.apk \
            luci-app-mihowrt_[0-9]*_all.ipk \
            luci-i18n-mihowrt-ru_[0-9]*_all.ipk \
            luci-app-mihowrt.ipk \
            luci-i18n-mihowrt-ru.ipk > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        run: |
          set -eu
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          awk -v v="$version" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty '## $version' section" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -eu
          set -- release/*.apk release/*.ipk release/SHA256SUMS
          if [ "$PRERELEASE" = 1 ]; then
            set -- --prerelease "$@"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$@"
