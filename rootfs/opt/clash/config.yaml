# Mihomo config used without a subscription.
# MihoWRT sets these itself, so they are not needed here: log-level, tproxy-port,
# routing-mark, allow-lan, bind-address, tun, profile, external-controller*,
# secret, external-ui* (dashboard) and dns enable/listen/fake-ip-range.
# Empty fake-ip whitelist: no proxy domains until a subscription is installed.
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

dns:
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 60
  fake-ip-filter-mode: whitelist
  fake-ip-filter: []
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - 77.88.8.8
    - 77.88.8.1

proxy-groups:
  - name: FALLBACK
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,FALLBACK
