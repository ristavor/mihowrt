# Mihomo config used without a subscription.
# MihoWRT sets these itself, so they are not needed here: tproxy-port,
# routing-mark, allow-lan, bind-address, tun, profile, external-controller*,
# secret, external-ui* (dashboard) and dns enable/listen/fake-ip-range.
# fake-ip with a whitelist filter: only selected traffic goes via the proxy.
mode: rule
ipv6: false
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: off

dns:
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 60
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:ru-bundle
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - 77.88.8.8
    - 77.88.8.1

proxy-groups:
  - name: FALLBACK
    type: select
    proxies:
      - DIRECT

rule-providers:
  ru-bundle:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/ru-bundle/rule.mrs
    path: ./ruleset/ru-bundle.mrs
    interval: 86400

rules:
  - MATCH,FALLBACK
