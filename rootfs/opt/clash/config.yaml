# Mihomo config used without a subscription.
# MihoWRT sets these itself, so they are not needed here: tproxy-port,
# routing-mark, allow-lan, bind-address, tun, profile, external-controller*,
# secret and dns enable/listen/enhanced-mode/fake-ip-range.
mode: rule
ipv6: false
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: off
external-ui: ./ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip'

dns:
  ipv6: false
  fake-ip-ttl: 60
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:ru-bundle
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - 77.88.8.8
    - 77.88.8.1

proxy-groups:
  - name: FALLBACK
    type: select
    proxies:
      - DIRECT

rule-providers:
  ru-bundle:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/ru-bundle/rule.mrs
    path: ./ruleset/ru-bundle.mrs
    interval: 86400

rules:
  - MATCH,FALLBACK
