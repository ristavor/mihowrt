dns:
  fake-ip-filter-mode: rule
  enhanced-mode: redir-host
  enable: true
  listen: 0.0.0.0:7874

# --- MihoWRT managed: generated, edits here are discarded ---
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
tproxy-port: 7894
routing-mark: 2
allow-lan: true
bind-address: "*"
tun:
  enable: false
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 127.0.0.1:9090
external-controller-unix: /tmp/clash/mihomo.sock
secret: "s3cr3t-value-0001"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"
